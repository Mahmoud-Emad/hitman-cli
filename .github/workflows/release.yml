name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build Release Binaries
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: hitman-linux-x86_64.tar.gz
            use-cross: false

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: hitman-linux-x86_64-musl.tar.gz
            use-cross: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: hitman-linux-aarch64.tar.gz
            use-cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            name: hitman-macos-x86_64.tar.gz
            use-cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            name: hitman-macos-aarch64.tar.gz
            use-cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: hitman-windows-x86_64.zip
            use-cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use-cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Setup Docker (for cross-compilation)
        if: matrix.use-cross
        uses: docker/setup-buildx-action@v3

      - name: Build binary (native)
        if: '!matrix.use-cross'
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross-compile)
        if: matrix.use-cross
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Create universal binary for macOS if both architectures are built
            tar czf ../../../${{ matrix.name }} hitman
          else
            tar czf ../../../${{ matrix.name }} hitman
          fi
          cd -

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }} hitman.exe
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root
        run: |
          # List the structure to debug
          echo "Artifact directory structure:"
          ls -la artifacts/

          # Each artifact creates its own directory, move files from subdirectories
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              echo "Processing directory: $dir"
              find "$dir" -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
            fi
          done

          # List what we have now
          echo "Files in root:"
          ls -la *.tar.gz *.zip 2>/dev/null || echo "No archive files found"

      - name: Generate checksums
        run: |
          for file in *.tar.gz *.zip; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> checksums.txt
            fi
          done

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: |
            *.tar.gz
            *.zip
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
